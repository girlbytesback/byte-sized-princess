<!doctype html>
<html>
  <head>
    <title>Guestbook</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      /* set the basic colors and text size here. */
      body {
        min-height: 100%;
        font-size: 20px;
        color: #878fec;
        text-align: center;
      }

      /* style the fields  */
      form {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding-bottom: 20px;
        border-bottom: 2px dotted #878fec;
      }
      /* give the fields and button matching colors and borders */
      input,
      textarea,
      button {
        color: #878fec;
        border: 1px solid #878fec;
        font-size: inherit;
      }

      button {
        padding: 2px 5px;
        width: fit-content;
        margin: auto;
        background: white;
        cursor: pointer;
      }
      /* leave a little space between entries. */
      .entry {
        text-align: left;
        margin: auto;
        margin-bottom: 10px;
      }

      /* give the name a little rounded label */
      .name {
        background: #878fec;
        padding: 2px 5px;
        color: white;
        width: fit-content;
        font-family: monospace;
        font-size: 18px;
        margin-bottom: 3px;
      }
    </style>
  </head>

  <body>
    <p>Leave a trace!</p>
    <!-- send the name and message to the server when the form is submitted -->
    <form action="/send-message" method="post">
      <input name="name" placeholder="name" /><br /><br />
      <textarea name="msg" placeholder="message"></textarea><br /><br />
      <button>Submit</button>
    </form>

    <!-- a sample entry: the name first, then the message -->
    <div class="entry">
      <div class="name">Actinomy</div>
      This is what a message looks like :)
    </div>
  </body>
</html>
